<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuacao do estudo de tabelas</title>
    <style>
        table {
            width: 400px;
            border-collapse: collapse;
        }

        tr, th, td {
            padding: 10px;
            border: 1px solid black;
        }

        .green {
            background-color: lightgreen;
        }

        .yellow {
            background-color: lightyellow;
        }

        .blue {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h1>Continuacao do estudo de tabelas </h1>
    <table>
        <colgroup>
            <col class="green">
            <col class="yellow" span="2">
            <col class="blue">
        </colgroup>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissao</th>
            </tr>
        </thead>
        <tBody>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
            <tr>
                <td>Claudio</td>
                <td>M</td>
                <td>28</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Gustavo</td>
                <td>M</td>
                <td>42</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>Helio</td>
                <td>M</td>
                <td>19</td>
                <td>Vendedor</td>
            </tr>
            <tr>
                <td>Otavio</td>
                <td>M</td>
                <td>22</td>
                <td>Nutricionista</td>
            </tr>
        </tBody>
    </table>
</body>
</html>
